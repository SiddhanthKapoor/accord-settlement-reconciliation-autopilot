<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Accord — AI that explains why the books don't close.</title>
    <meta
      name="description"
      content="Accord reconciles payments, settlements, bank statements and your ledger, then investigates each record that did not close. Deterministic math decides first; a model is consulted only where the ambiguity is genuinely semantic, and it can never book money."
    />
    <meta name="theme-color" content="#0B121C" />

    <!-- SVG first and marked `any`, so a browser that can scale it does,
         at whatever density the tab actually needs. The PNGs are rendered
         from that same SVG rather than drawn separately, so the three can
         never drift apart — which is exactly what had happened: the SVG
         still carried the previous product's mark, and because browsers
         prefer SVG, that was the icon everyone saw. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Paths are root-relative: there is no canonical domain for this build
         yet, and inventing one would put a dead URL in the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accord" />
    <meta property="og:title" content="Accord — AI that explains why the books don't close." />
    <meta
      property="og:description"
      content="Multi-source reconciliation that investigates what didn't close. Deterministic math first, AI only for genuine semantic ambiguity, every decision in a hash-chained audit ledger."
    />
    <meta property="og:image" content="/brand/accord-hero.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Accord — multi-source reconciliation" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Accord — AI that explains why the books don't close." />
    <meta
      name="twitter:description"
      content="Multi-source reconciliation that investigates what didn't close. Deterministic math first, AI only for genuine semantic ambiguity, every decision in a hash-chained audit ledger."
    />
    <meta name="twitter:image" content="/brand/accord-hero.jpg" />
    <meta name="twitter:image:alt" content="Accord — multi-source reconciliation" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
